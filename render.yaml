services:
  - type: web
    name: buscador-empresas-br
    runtime: node
    plan: starter            # o plano free hiberna; starter mantem a importacao viva
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # cole aqui a string de conexao do MongoDB Atlas
      - key: ADMIN_TOKEN
        generateValue: true  # o Render cria um token forte sozinho (copie e cole em Configuracoes)
      - key: API_KEY
        sync: false          # opcional: protege a API publica
      - key: CORS_ORIGIN
        value: "*"

