services:
  - type: web
    name: buscador-empresas-br
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # preencha no painel do Render
      - key: API_KEY
        sync: false          # opcional
      - key: CORS_ORIGIN
        value: "*"
